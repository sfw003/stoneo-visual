<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 小尺寸帧 S3（≤32px）：探头的水豚把放大镜举在斜眼前，镜框套住眼睛 -->
  <defs><clipPath id="tile"><rect x="2" y="2" width="28" height="28" rx="6.5"/></clipPath></defs>
  <rect data-role="plate" x="2" y="2" width="28" height="28" rx="6.5" fill="#F7F2EA"/>
  <rect data-role="plate-edge" x="2.5" y="2.5" width="27" height="27" rx="6" fill="none" stroke="#DDD1C0" stroke-width="1"/>
  <g clip-path="url(#tile)" stroke="#2B2520" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="26" height="24" rx="8" fill="#FFFDF8" stroke-width="2"/>
    <rect x="4" y="16" width="7" height="12" rx="3" fill="#EE9A55" stroke="none"/>
    <line x1="23.5" y1="23.5" x2="27" y2="27" stroke-width="3.5"/>
    <circle cx="19" cy="19" r="5" fill="#FFFDF8" stroke-width="2"/>
    <rect x="17" y="19" width="4" height="3.5" rx="1.5" fill="#2B2520" stroke="none"/>
    <line x1="15" y1="19" x2="23" y2="19" stroke-width="2"/>
  </g>
</svg>
