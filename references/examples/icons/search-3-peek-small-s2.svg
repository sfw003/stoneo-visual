<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 小尺寸帧 S2（≤32px）：头顶满底板，耳朵和放大镜合成一个形状：头顶只有一个“耳朵”，它就是镜框 -->
  <defs><clipPath id="tile"><rect x="2" y="2" width="28" height="28" rx="6.5"/></clipPath></defs>
  <rect data-role="plate" x="2" y="2" width="28" height="28" rx="6.5" fill="#F7F2EA"/>
  <rect data-role="plate-edge" x="2.5" y="2.5" width="27" height="27" rx="6" fill="none" stroke="#DDD1C0" stroke-width="1"/>
  <g clip-path="url(#tile)" stroke="#2B2520" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="13" width="28" height="22" rx="8" fill="#FFFDF8" stroke-width="2"/>
    <line x1="25" y1="7" x2="27.5" y2="4.5" stroke-width="3.5"/>
    <circle cx="21" cy="11" r="4.5" fill="#FFFDF8" stroke-width="2.5"/>
    <rect x="4" y="18" width="8" height="10" rx="3" fill="#EE9A55" stroke="none"/>
    <rect x="17" y="22" width="4" height="4" rx="1.5" fill="#2B2520" stroke="none"/>
    <line x1="15" y1="21" x2="25" y2="21" stroke-width="2"/>
  </g>
</svg>
