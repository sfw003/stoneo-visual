<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- stoneo icon · 搜索工具 · 方向 3 大图（48px 以上）：水豚探半个头，头顶放大镜 -->
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <clipPath id="underlid"><rect x="0" y="708" width="1024" height="300"/></clipPath>
  </defs>
  <rect data-role="plate" x="64" y="64" width="896" height="896" rx="208" fill="#F7F2EA"/>
  <rect data-role="plate-edge" x="70" y="70" width="884" height="884" rx="202" fill="none" stroke="#E3D8C8" stroke-width="12"/>
  <g clip-path="url(#tile)" stroke="#2B2520" stroke-linecap="round" stroke-linejoin="round">
    <!-- 耳朵：小圆耳，靠后（右） -->
    <circle cx="580" cy="494" r="64" fill="#FFFDF8" stroke-width="48"/>
    <circle cx="790" cy="516" r="64" fill="#FFFDF8" stroke-width="48"/>
    <!-- 圆角方大头 -->
    <rect x="160" y="520" width="760" height="700" rx="250" fill="#FFFDF8" stroke-width="64"/>
    <!-- 杏色钝吻（头的前端） -->
    <rect x="192" y="670" width="240" height="300" rx="96" fill="#EE9A55" stroke="none"/>
    <ellipse cx="244" cy="730" rx="20" ry="16" fill="#2B2520" stroke="none"/>
    <!-- 斜眼：眉线 + 平而重的上眼皮 + 只露下半、偏前的眼珠 -->
    <line x1="612" y1="626" x2="716" y2="616" stroke-width="40"/>
    <g clip-path="url(#underlid)"><circle cx="640" cy="708" r="62" fill="#2B2520" stroke="none"/></g>
    <line x1="568" y1="708" x2="790" y2="708" stroke-width="60"/>
    <!-- 放大镜：粗镜框 + 短粗柄，45° 搁在头顶前侧 -->
    <line x1="380" y1="344" x2="432" y2="396" stroke-width="104"/>
    <circle cx="286" cy="250" r="104" fill="#FFFDF8" stroke-width="76"/>
  </g>
</svg>
